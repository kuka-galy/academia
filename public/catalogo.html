<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | WoWacademy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* 1. VARIABLES Y CONFIGURACIÓN GLOBAL */
        :root {
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --primary-dark: #1b5e20;
            --primary-soft: rgba(46, 125, 50, 0.09);
            --dark: #0f172a;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-gradient-start: #e8f5e9; 
            --bg-gradient-middle: #f1f8e9;
            --bg-body: #f8fafc;
            --white: #ffffff;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --shadow-soft: 0 4px 20px -2px rgba(15, 23, 42, 0.04), 0 2px 10px -1px rgba(15, 23, 42, 0.02);
            --shadow-hover: 0 20px 25px -5px rgba(46, 125, 50, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, 
                var(--bg-gradient-start) 0%, 
                var(--bg-gradient-middle) 35%, 
                var(--bg-body) 70%
            );
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* 2. NAVEGACIÓN Y CABECERA */
        nav {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 1.25rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(226, 232, 240, 0.6);
            position: sticky; 
            top: 0; 
            z-index: 100;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.01);
        }

        .nav-logo { 
            font-weight: 800; 
            font-size: 1.6rem; 
            text-decoration: none; 
            color: var(--dark); 
            letter-spacing: -0.8px; 
        }

        .nav-logo span { 
            color: var(--primary); 
        }

        .nav-back { 
            text-decoration: none; 
            color: var(--primary); 
            font-weight: 600; 
            font-size: 0.95rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-back:hover { 
            color: var(--primary-dark);
            transform: translateX(-4px); 
        }

        .header-section { 
            text-align: center; 
            padding: 70px 24px 35px; 
            max-width: 800px;
            margin: 0 auto;
        }

        .header-section h1 { 
            font-size: clamp(2.6rem, 5.5vw, 3.8rem); 
            font-weight: 900; 
            margin-bottom: 18px; 
            color: var(--dark);
            letter-spacing: -2px;
            line-height: 1.1;
        }

        .header-section h1 span { 
            color: var(--primary); 
            position: relative;
            display: inline-block;
        }

        .header-section p { 
            color: var(--text-muted); 
            font-size: 1.25rem; 
            font-weight: 500;
            letter-spacing: -0.2px;
        }

        /* 3. BUSCADOR */
        .search-container { 
            max-width: 650px; 
            margin: 0 auto 55px; 
            padding: 0 24px; 
        }

        .search-wrapper { 
            position: relative; 
            display: flex;
            align-items: center;
        }

        .search-wrapper::after {
            content: "";
            position: absolute;
            left: 24px;
            width: 18px;
            height: 18px;
            border: 2.5px solid var(--text-muted);
            border-radius: 50%;
            transition: all 0.3s ease;
            pointer-events: none;
            opacity: 0.6;
        }

        .search-wrapper::before {
            content: "";
            position: absolute;
            left: 39px;
            top: 23px;
            width: 2.5px;
            height: 8px;
            background: var(--text-muted);
            transform: rotate(-45deg);
            transition: all 0.3s ease;
            pointer-events: none;
            opacity: 0.6;
            z-index: 2;
        }
        
        #courseSearch {
            width: 100%; 
            padding: 18px 24px 18px 56px; 
            border-radius: var(--radius-md);
            border: 1px solid rgba(226, 232, 240, 0.9); 
            font-size: 1.05rem; 
            outline: none;
            background: var(--white);
            box-shadow: var(--shadow-soft);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            font-weight: 500;
            color: var(--dark);
        }

        #courseSearch::placeholder {
            color: var(--text-muted);
            opacity: 0.75;
        }

        #courseSearch:focus {
            border-color: var(--primary-light);
            box-shadow: 0 12px 30px -5px rgba(46, 125, 50, 0.12);
            transform: translateY(-2px);
        }

        .search-wrapper:focus-within::after {
            border-color: var(--primary);
            opacity: 1;
        }
        
        .search-wrapper:focus-within::before {
            background: var(--primary);
            opacity: 1;
        }

        /* 4. GRID Y TARJETAS DEL CATÁLOGO */
        .container { 
            max-width: 1240px; 
            margin: 0 auto; 
            padding: 0 24px 80px; 
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 32px;
        }

        .course-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: var(--shadow-soft);
            opacity: 0;
        }

        .course-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(76, 175, 80, 0.4);
            background: var(--white);
        }

        .image-box {
            width: 100%;
            height: 210px;
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid rgba(241, 245, 249, 0.8);
        }

        .image-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, rgba(76, 175, 80, 0.08) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 0;
        }

        .course-card:hover .image-box::before {
            opacity: 1;
        }

        .image-box img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain; 
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
            filter: drop-shadow(0 8px 12px rgba(15, 23, 42, 0.06));
        }

        .course-card:hover .image-box img {
            transform: scale(1.08) translateY(-2px);
        }

        .course-content { 
            padding: 28px; 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            position: relative;
        }

        .badge {
            position: absolute;
            top: -18px;
            left: 28px;
            background: var(--white);
            color: var(--primary);
            border: 1px solid rgba(46, 125, 50, 0.15);
            font-size: 0.72rem;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            width: fit-content;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.06);
            z-index: 2;
        }

        .course-content h3 { 
            font-size: 1.35rem; 
            margin: 8px 0 12px 0; 
            font-weight: 800; 
            color: var(--dark);
            line-height: 1.3;
            letter-spacing: -0.5px;
        }
        
        .course-content p { 
            font-size: 0.95rem; 
            color: var(--text-muted); 
            margin-bottom: 24px; 
            flex-grow: 1; 
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 5. BOTONES Y ESTADOS */
        .btn-enroll {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            display: block;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.15);
            letter-spacing: -0.1px;
        }

        .btn-enroll:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 125, 50, 0.3);
        }

        .btn-enroll:active {
            transform: translateY(0);
        }

        .empty-state {
            text-align: center;
            padding: 80px 24px;
            grid-column: 1 / -1;
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.5);
            border-radius: var(--radius-lg);
            border: 1px dashed rgba(226, 232, 240, 0.8);
        }

        /* 6. ANIMACIONES Y MEDIA QUERIES */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            nav {
                padding: 1rem 5%;
            }
            .header-section { 
                padding: 50px 20px 30px; 
            }
            .header-section h1 { 
                font-size: 2.2rem; 
            }
            .catalog-grid { 
                gap: 24px; 
            }
            .course-card {
                border-radius: var(--radius-md);
            }
        }
    </style>
    <link rel="stylesheet" href="assets/css/chatbot.css">
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo"><span>WoW</span>academy</a>
        <a href="index.html" class="nav-back">← Volver al inicio</a>
    </nav>

    <header class="header-section">
        <h1>Explora nuestra <span>Formación</span></h1>
        <p>Cursos prácticos diseñados para impulsar tu carrera tecnológica.</p>
    </header>

    <div class="search-container">
        <div class="search-wrapper">
            <input type="text" id="courseSearch" placeholder="¿Qué quieres aprender hoy? Busca por tecnología...">
        </div>
    </div>

    <div class="container">
        <div id="catalogGrid" class="catalog-grid"></div>
    </div>

    <script>
        let todosLosCursos = [];

        async function fetchPublicCourses() {
            try {
                const response = await fetch('/api/cursos?limit=100');
                const resultado = await response.json();
                
                todosLosCursos = resultado.data || [];
                renderCursos(todosLosCursos);
            } catch (e) {
                console.error("Error cargando cursos desde la BBDD");
                document.getElementById('catalogGrid').innerHTML = 
                    '<div class="empty-state">No se pudieron cargar los cursos. Por favor, intenta más tarde.</div>';
            }
        }

        function renderCursos(cursosFiltrados) {
            const container = document.getElementById('catalogGrid');
            container.innerHTML = '';

            if(cursosFiltrados.length === 0) {
                container.innerHTML = '<div class="empty-state">No se encontraron cursos que coincidan con tu búsqueda.</div>';
                return;
            }

            cursosFiltrados.forEach((curso, index) => {
                const imagenUrl = curso.imagen ? curso.imagen : '';
                const rutaImagen = imagenUrl.startsWith('http') ? imagenUrl : `/${imagenUrl}`;
                const card = document.createElement('div');
                card.className = 'course-card';
                card.style.animation = `fadeInUp 0.5s ease forwards ${index * 0.1}s`;
                
                card.innerHTML = `
                    <div class="image-box">
                        <img src="${rutaImagen}" alt="${curso.titulo || 'Curso'}" onerror="this.src='https://via.placeholder.com/400x220?text=WoWacademy'">
                    </div>
                    <div class="course-content">
                        <span class="badge">Certificación Oficial</span>
                        <h3>${curso.titulo || 'Curso sin título'}</h3>
                        <p>${curso.descripcion || 'Sin descripción disponible.'}</p>
                        <a href="#" class="btn-enroll">Ver detalles del curso</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('courseSearch').addEventListener('input', (e) => {
            const busqueda = e.target.value.toLowerCase();
            const filtrados = todosLosCursos.filter(c => 
                (c.titulo && c.titulo.toLowerCase().includes(busqueda)) || 
                (c.descripcion && c.descripcion.toLowerCase().includes(busqueda))
            );
            renderCursos(filtrados);
        });

        window.onload = fetchPublicCourses;
    </script>
    <script src="assets/js/chatbot.js" defer></script>
</body>
</html>
