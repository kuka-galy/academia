<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias y Avisos | WoWacademy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* 1. VARIABLES Y CONFIGURACIÓN GLOBAL */
        :root {
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --primary-soft: #f0fdf4;
            --dark: #0f172a;
            --text-main: #334155;
            --text-muted: #64748b;
            --bg-gradient-start: #e8f5e9; 
            --bg-gradient-middle: #f1f8e9;
            --bg-body: #f8fafc;
            --white: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.04), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            --radius-lg: 20px;
            --radius-md: 12px;
            --color-noticia: #166534;
            --bg-noticia: #f0fdf4;
            --border-noticia: rgba(22, 101, 52, 0.12);
            --color-aviso: #b45309;
            --bg-aviso: #fffbeb;
            --border-aviso: rgba(180, 83, 9, 0.12);
            --color-important: #dc2626;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body { 
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-middle) 50%, var(--bg-body) 100%);
            background-attachment: fixed;
            color: var(--dark); 
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* 2. BARRA DE NAVEGACIÓN */
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            box-shadow: var(--shadow-sm);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { 
            font-weight: 800; 
            font-size: 1.4rem; 
            text-decoration: none; 
            color: var(--dark); 
            letter-spacing: -0.5px;
        }

        .logo span { 
            color: var(--primary); 
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }
        
        .btn-nav { 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 0.85rem; 
            padding: 10px 20px;
            border-radius: var(--radius-md);
            transition: all 0.2s ease;
        }

        .btn-home {
            background: transparent;
            color: var(--text-main);
            border: 1px solid rgba(0,0,0,0.1);
        }

        .btn-home:hover {
            background: rgba(0,0,0,0.04);
            color: var(--dark);
        }

        .btn-back { 
            color: white; 
            background: var(--primary);
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.2);
        }

        .btn-back:hover { 
            background: #1b5e20;
            transform: translateY(-1px);
        }

        /* 3. DISEÑO ESTRUCTURAL */
        .container {
            max-width: 850px;
            margin: 50px auto 100px;
            padding: 0 24px;
        }

        .page-title-block {
            margin-bottom: 36px;
        }

        .page-title-block h1 {
            font-size: clamp(2rem, 4vw, 2.6rem);
            font-weight: 800;
            line-height: 1.2;
            color: var(--dark);
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .page-title-block p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        /* 4. BOTONES DE FILTRADO */
        .news-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 32px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .filter-btn {
            padding: 10px 22px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(0,0,0,0.05);
            background: var(--white);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.2);
        }

        .filter-btn:hover:not(.active) {
            background: var(--white);
            color: var(--primary);
            border-color: var(--primary);
        }

        /* 5. CONTENEDOR DE FEED Y DISEÑO DE TARJETAS MODIFICADO */
        .news-feed {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .news-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-md);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(15, 23, 42, 0.05);
        }

        .news-card:hover {
            transform: translateY(-4px);
        }

        .news-card.card-noticia {
            background: linear-gradient(180deg, var(--white) 65%, var(--bg-noticia) 100%);
            border-bottom: 3px solid var(--border-noticia);
        }

        .news-card.card-noticia:hover {
            box-shadow: 0 16px 30px rgba(46, 125, 50, 0.08);
        }

        .news-card.card-aviso {
            background: linear-gradient(180deg, var(--white) 65%, var(--bg-aviso) 100%);
            border-bottom: 3px solid var(--border-aviso);
        }
        .news-card.card-aviso:hover {
            box-shadow: 0 16px 30px rgba(180, 83, 9, 0.08);
        }

        .news-card.is-important {
            border-left: 6px solid var(--color-important);
        }
        .news-card.is-important:hover {
            box-shadow: 0 16px 35px rgba(220, 38, 38, 0.1);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .card-badge {
            padding: 6px 14px;
            border-radius: var(--radius-md);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .card-noticia .card-badge { 
            background: var(--bg-noticia); 
            color: var(--color-noticia); 
        }

        .card-aviso .card-badge { 
            background: var(--bg-aviso); 
            color: var(--color-aviso); 
        }

        .news-card.is-important .card-badge {
            border: 1px solid rgba(220, 38, 38, 0.2);
            box-shadow: 0 2px 4px rgba(220, 38, 38, 0.05);
            background: #fef2f2;
            color: var(--color-important);
        }

        .card-time {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .card-title {
            font-size: 1.45rem;
            color: var(--dark);
            font-weight: 700;
            letter-spacing: -0.4px;
            line-height: 1.3;
        }

        .card-content {
            color: var(--text-main);
            font-size: 0.98rem;
            white-space: pre-line;
            line-height: 1.75;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo"><span>WoW</span>academy</a>
            <div class="nav-buttons">
                <a href="index.html" class="btn-nav btn-home">Menú Principal</a>
                <a href="alumno.html" class="btn-nav btn-back">Volver al Panel</a>
            </div>
        </div>
    </header>

    <div class="container">
        <section class="page-title-block">
            <h1>Tablón de Anuncios</h1>
            <p>Infórmate sobre los comunicados importantes, alertas técnicas y novedades del centro académico.</p>
        </section>

        <div class="news-filters">
            <button class="filter-btn active" data-type="todos">Todos</button>
            <button class="filter-btn" data-type="noticias">Noticias</button>
            <button class="filter-btn" data-type="avisos">Avisos</button>
            <button class="filter-btn" data-type="importantes">Importantes</button>
        </div>

        <main class="news-feed" id="news-container">
            </main>
    </div>

    <footer>
        <a href="#" class="footer-logo"><span>WoW</span>academy</a>
        <p class="footer-copy">© 2026 WoWacademy by Win O Win. Impulsando el talento tecnológico.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const newsContainer = document.getElementById('news-container');
            const filterButtons = document.querySelectorAll('.filter-btn');
            let localNewsData = []; 

            /* 1. CARGA INICIAL DEL ENDPOINT DE LA API */
            async function loadInitialNews() {
                try {
                    newsContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 40px 0; font-weight: 500;">Sincronizando tablón...</p>';
                    
                    const response = await fetch('/api/news?limit=50&order=desc');
                    if (!response.ok) throw new Error('Error al conectar con la API');
                    
                    const json = await response.json();
                    localNewsData = json.data || [];

                    renderNews('todos');

                } catch (error) {
                    console.error(error);
                    newsContainer.innerHTML = '<p style="text-align: center; color: #ef4444; padding: 40px 0; font-weight: 600;">Error al sincronizar con el servidor.</p>';
                }
            }

            /* 2. FILTRADO */
            function renderNews(filterType) {
                newsContainer.innerHTML = '';

                const filteredList = localNewsData.filter(item => {
                    if (filterType === 'todos') return true;
                    
                    const isImportant = Number(item.important) === 1;
                    const itemType = item.tipo ? item.tipo.toUpperCase() : 'NOTICIA';
                    
                    if (filterType === 'importantes') {
                        return isImportant;
                    }
                    
                    if (filterType === 'noticias') {
                        return itemType === 'NOTICIA';
                    }
                    
                    if (filterType === 'avisos') {
                        return itemType === 'AVISO';
                    }
                    
                    return true;
                });

                if (filteredList.length === 0) {
                    newsContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 40px 0; font-weight: 500;">No hay comunicados disponibles en esta sección.</p>';
                    return;
                }

                filteredList.forEach(news => {
                    const card = createNewsCard(news);
                    newsContainer.appendChild(card);
                });
            }

            /* 3. ARQUITECTURA VISUAL DE TARJETAS */
            function createNewsCard(news) {
                const article = document.createElement('article');
                
                const fechaFormateada = news.fecha ? new Date(news.fecha).toLocaleDateString('es-ES', {
                    day: 'numeric', month: 'long', year: 'numeric'
                }) : 'Reciente';

                const isImportant = Number(news.important) === 1;
                const itemType = news.tipo ? news.tipo.toUpperCase() : 'NOTICIA';

                let badgeText = '';
                let typeClass = '';

                if (itemType === 'AVISO') {
                    badgeText = 'Aviso';
                    typeClass = 'card-aviso';
                } else {
                    badgeText = 'Noticia';
                    typeClass = 'card-noticia';
                }

                let importantClass = '';
                if (isImportant) {
                    importantClass = 'is-important';
                    badgeText = `⚠️ Alta Prioridad: ${badgeText}`;
                }

                article.className = `news-card ${typeClass} ${importantClass}`;
                article.innerHTML = `
                    <div class="card-meta">
                        <span class="card-badge">${badgeText}</span>
                        <time class="card-time">${fechaFormateada}</time>
                    </div>
                    <h2 class="card-title">${news.titulo}</h2>
                    <p class="card-content">${news.contenido}</p>
                `;

                return article;
            }

            /* 4. EVENTOS DE FILTRADO */
            filterButtons.forEach(button => {
                button.addEventListener('click', () => {
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');

                    const targetType = button.getAttribute('data-type');
                    renderNews(targetType);
                });
            });

            loadInitialNews();
        });
    </script>
</body>
</html>
